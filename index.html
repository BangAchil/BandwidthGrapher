<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BandwidthGrapher Playground</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, sans-serif;
        background: #e5e7eb;
        color: #111827;
      }

      .page {
        padding: 24px;
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        margin-bottom: 18px;
      }

      button {
        border: 1px solid #9ca3af;
        background: #ffffff;
        padding: 8px 10px;
        border-radius: 4px;
        cursor: pointer;
      }

      button:hover {
        background: #f3f4f6;
      }

      #graph {
        width: 100%;
        height: 346px;
        background: #f8fafc;
      }
    </style>
  </head>
  <body>
    <main class="page">
      <div class="toolbar">
        <button id="live">Live dummy</button>
        <button id="timeout">Push timeout</button>
        <button id="timeout-range">Timeout range</button>
        <button id="history">Load history</button>
        <button id="threshold">Toggle threshold</button>
        <button id="export">Export image</button>
      </div>
      <div id="graph"></div>
    </main>
    <script type="module" src="/examples/vanilla/main.ts"></script>
  </body>
</html>
